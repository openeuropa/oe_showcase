name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - 1.x

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type:
          - update
          - install
    env:
      PHP_VERSION: 8.3
    steps:
      - name: Clone repository (install)
        if: ${{ matrix.type != 'update' }}
        uses: actions/checkout@v2

      - name: Clone repository (update)
        if: ${{ matrix.type == 'update' }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Report current commit
        run: |
          git rev-parse HEAD
          git status
          git log --graph --decorate --pretty=oneline --abbrev-commit --abbrev=20 -n 20

      - name: Checkout older version (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          git tag -f CURRENT
          git fetch --tags
          git log --graph --decorate --pretty=oneline --abbrev-commit --abbrev=8
          git status
          LATEST_TAG=$(git describe --abbrev=0 --tags --match=[1-9]*.[0-9]*.[0-9]*)
          echo "Latest tag: $LATEST_TAG"
          # Mark the current commit with a tag.
          git checkout $LATEST_TAG

      - name: Report current commit (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          git rev-parse HEAD
          git status
          git log --graph --decorate --pretty=oneline --abbrev-commit --abbrev=20 -n 20

      - name: Modify web container version
        run: |
          # Replace -dev with -ci.
          sed -i 's/httpd-php:8\.3-\(dev\|ci\)/httpd-php:8.3-ci/g' docker-compose.yml
          # Report the difference.
          git diff

      - name: Start services with Docker Compose
        run: docker compose up -d

      - run: sleep 3

      - run: docker compose exec -T web composer self-update

      - name: Restart docker containers (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose up -d --build

      - name: Wait until container ready (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          until docker compose ps --status=running | grep -q 'web'; do
            echo wait
            sleep 1
          done

      #      - run: sleep 13

      - run: docker compose exec web php -v
        if: ${{ matrix.type == 'update' }}

      - run: docker compose exec -T web php -v
        if: ${{ matrix.type == 'update' }}

      - name: Run composer self-update, again (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose exec -T web composer self-update

      - name: Restart docker containers (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose up -d --build

      - name: Wait until container ready (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          until docker compose ps --status=running | grep -q 'web'; do
            echo wait
            sleep 1
          done

      - run: docker compose exec web php -v
        if: ${{ matrix.type == 'update' }}

      - run: docker compose exec -T web php -v
        if: ${{ matrix.type == 'update' }}

      - name: Run composer self-update, again (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose exec -T web composer self-update

      - name: Build dependencies
        run: docker compose exec -T web composer install

      - name: Restart docker containers (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose up -d --build

      - name: Wait until container ready (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          until docker compose ps --status=running | grep -q 'web'; do
            echo wait
            sleep 1
          done

      #      - run: sleep 13

      - run: docker compose exec web php -v
        if: ${{ matrix.type == 'update' }}

      - run: docker compose exec -T web php -v
        if: ${{ matrix.type == 'update' }}

      - name: Run composer self-update, again (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose exec -T web composer self-update

      - name: Install Drupal
        run: |
          docker compose exec -T web ./vendor/bin/run drupal:site-install
          docker compose exec -T web ./vendor/bin/drush pmu -y update
          docker compose exec -T web ./vendor/bin/run ci:site-setup
          docker compose exec -T web ./vendor/bin/drush en -y oe_showcase_test

      - name: Return to current version (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          git status
          git diff
          git stash
          git checkout CURRENT
          git stash apply

      - name: Report current commit (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          git rev-parse HEAD
          git status
          git log --graph --decorate --pretty=oneline --abbrev-commit --abbrev=20 -n 20

      - name: Restart docker containers (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose up -d --build

      - name: Wait until container ready (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          until docker compose ps --status=running | grep -q 'web'; do
            echo wait
            sleep 1
          done

#      - run: sleep 13

      - run: docker compose exec web php -v
        if: ${{ matrix.type == 'update' }}

      - run: docker compose exec -T web php -v
        if: ${{ matrix.type == 'update' }}

      - name: Run composer self-update, again (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose exec -T web composer self-update

      - name: Install composer dependencies, again (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose exec -T web composer install

      - name: Drupal database updates (update only)
        if: ${{ matrix.type == 'update' }}
        run: |
          docker compose exec -T web ./vendor/bin/drush updb -y
          docker compose exec -T web ./vendor/bin/drush cr

      - name: Run grumphp (install only)
        if: ${{ matrix.type != 'update' }}
        run: docker compose exec -T web ./vendor/bin/grumphp run

      - name: Run phpunit
        run: docker compose exec -T web ./vendor/bin/phpunit
